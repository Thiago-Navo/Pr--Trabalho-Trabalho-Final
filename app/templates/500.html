{% extends "base.html" %}

{% block titulo %}500 — Erro interno — TechStock{% endblock %}

{% block conteudo %}
<section class="container py-5" style="max-width: 700px; margin: 40px auto; text-align: center;">
  <div style="background: var(--surface, #ffffff); border-radius: 16px; padding: 48px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);">
    <h1 style="font-size: 5rem; font-weight: 800; color: #EF4444; margin: 0;">500</h1>
    <h2 style="font-size: 1.5rem; margin: 16px 0 8px; color: var(--text, #0f172a);">Erro interno do sistema</h2>
    <p style="color: var(--text-muted, #64748b); font-size: 1rem; margin-bottom: 24px;">Ocorreu uma falha inesperada no processamento da solicitação. Nossa equipe já registrou o evento.</p>
    <a href="{{ url_for('dashboard') }}" class="btn-primary-custom" style="display: inline-block; padding: 10px 24px;">
      <i class="bi bi-arrow-left"></i> Voltar ao Dashboard
    </a>
  </div>
</section>
{% endblock %}
